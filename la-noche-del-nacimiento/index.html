<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070c">
  <meta name="description" content="La Noche del Nacimiento: cinco historias navideñas interactivas para disfrutar en pantallas táctiles.">
  <title>La Noche del Nacimiento</title>

  <!-- Tipografías: Cinzel Decorative para los títulos y Nunito para la lectura -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Recursos que conviene tener listos desde el primer instante -->
  <link rel="preload" href="recursos/fondo-genral.webp" as="image">
  <link rel="preload" href="recursos/disco.webp" as="image">
  <link rel="preload" href="recursos/bambalina.webp" as="image">

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070a13'/%3E%3Cpath d='M50 12l7.6 24.4L82 44l-24.4 7.6L50 76l-7.6-24.4L18 44l24.4-7.6z' fill='%23e8c27a'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============================================================
       VELO DE CARGA
       Se retira solo (aunque JavaScript tarde) y evita el parpadeo
       de los primeros fotogramas del escenario.
       ============================================================ -->
  <div class="velo-carga" id="veloCarga" aria-hidden="true">
    <span class="velo-estrella">✦</span>
    <p class="velo-titulo">La Noche del Nacimiento</p>
    <p class="velo-sub">Preparando el árbol…</p>
  </div>

  <!-- ============================================================
       VISTA A · ESCENARIO PRINCIPAL
       Contenedor 100vw x 100vh sin scroll. El "escenario" conserva
       siempre la proporción exacta de fondo-genral.webp.
       ============================================================ -->
  <div class="escenario-envoltorio">
    <main class="escenario" id="escenario" aria-label="Escena navideña interactiva">

      <!-- Video del nacimiento: queda detrás de la imagen; la zona
           transparente del establo central lo deja ver. -->
      <video class="pesebre-video" id="videoPesebre"
             src="recursos/Nacimiento.mp4"
             autoplay loop muted playsinline preload="auto"
             aria-hidden="true" tabindex="-1"></video>

      <!-- Imagen maestra con el hueco del establo y los cinco adornos -->
      <img class="fondo-escena" src="recursos/fondo-genral.webp"
           alt="Un árbol de Navidad iluminado con un pesebre de madera en el centro, cinco esferas decoradas y una mesa tallada."
           draggable="false">

      <div class="capa-vineta" aria-hidden="true"></div>

      <!-- ---------- 5 áreas táctiles sobre las esferas del árbol ---------- -->
      <button class="zona-bambalina" type="button" data-historia="0"
              aria-label="Abrir la historia de María y José: El Viaje a Belén">
        <span class="etiqueta-esfera">María y José</span>
      </button>

      <button class="zona-bambalina" type="button" data-historia="1"
              aria-label="Abrir la historia de los pastores y los ángeles: La Fiesta del Cielo y la Tierra">
        <span class="etiqueta-esfera">Los Pastores y los Ángeles</span>
      </button>

      <button class="zona-bambalina" type="button" data-historia="2"
              aria-label="Abrir la historia de la Estrella de Belén: La Guía de Luz">
        <span class="etiqueta-esfera">La Estrella de Belén</span>
      </button>

      <button class="zona-bambalina" type="button" data-historia="3"
              aria-label="Abrir la historia de los Reyes Magos: El Viaje de la Generosidad">
        <span class="etiqueta-esfera">Los Reyes Magos</span>
      </button>

      <button class="zona-bambalina" type="button" data-historia="4"
              aria-label="Abrir la historia de San Nicolás: El Ayudante del Cumpleañero">
        <span class="etiqueta-esfera">San Nicolás</span>
      </button>

      <!-- ---------- Consola musical tallada en la mesa ---------- -->
      <section class="reproductor" id="reproductor" aria-label="Consola de música navideña">
        <!-- Disco central: gira solo mientras suena la música -->
        <div class="disco-marco" id="discoMarco">
          <img class="disco-imagen" src="recursos/disco.webp" alt="" draggable="false">
          <span class="disco-brillo" aria-hidden="true"></span>
          <button class="btn-play" id="btnPlay" type="button"
                  aria-label="Reproducir música" aria-pressed="false">
            <svg class="icono-play" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M8.4 5.2a1 1 0 0 1 1.5-.87l9.1 6.8a1 1 0 0 1 0 1.74l-9.1 6.8a1 1 0 0 1-1.5-.86z"/>
            </svg>
            <svg class="icono-pausa" viewBox="0 0 24 24" aria-hidden="true">
              <rect x="6.4" y="5" width="4.2" height="14" rx="1.4"/>
              <rect x="13.4" y="5" width="4.2" height="14" rx="1.4"/>
            </svg>
          </button>
        </div>

        <!-- Canciones: anterior y siguiente, en los nichos laterales -->
        <button class="btn-lateral" id="btnAnterior" type="button"
                aria-label="Canción anterior" title="Canción anterior">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5.2" y="5" width="2.6" height="14" rx="1.3"/>
            <path d="M19 6.6a1 1 0 0 0-1.55-.83l-8.6 5.4a1 1 0 0 0 0 1.7l8.6 5.4A1 1 0 0 0 19 17.4z"/>
          </svg>
        </button>

        <button class="btn-lateral" id="btnSiguiente" type="button"
                aria-label="Canción siguiente" title="Canción siguiente">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="16.2" y="5" width="2.6" height="14" rx="1.3"/>
            <path d="M5 6.6a1 1 0 0 1 1.55-.83l8.6 5.4a1 1 0 0 1 0 1.7l-8.6 5.4A1 1 0 0 1 5 17.4z"/>
          </svg>
        </button>

        <!-- Control de volumen alojado en el canal tallado derecho -->
        <label class="volumen" id="volumenCaja" for="volumen">
          <input type="range" id="volumen" min="0" max="1" step="0.05" value="0.8"
                 aria-label="Volumen de la música">
        </label>

        <!-- Rótulo elegante con la pista en curso -->
        <div class="pista-actual" id="pistaActual" aria-live="polite">
          <span class="ecualizador" id="ecualizador" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
          <span class="pista-info">
            <span class="pista-prefijo">Voz Veis</span>
            <span class="pista-titulo" id="tituloPista">Como Se Llega A Belén</span>
          </span>
          <span class="pista-contador" id="contadorPista">1/4</span>
        </div>
      </section>

      <!-- Pista de uso que se desvanece sola -->
      <aside class="ayuda-inicial" id="ayudaInicial" role="status">
        <span class="ayuda-icono" aria-hidden="true">✦</span>
        <p>Toca las esferas del árbol para vivir <strong>cinco historias</strong></p>
      </aside>

      <!-- Pantalla completa (muy útil en tablets y kioscos) -->
      <button class="btn-pantalla" id="btnPantalla" type="button"
              aria-label="Entrar en pantalla completa" title="Pantalla completa">
        <svg class="icono-expandir" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 9V5.6A1.6 1.6 0 0 1 5.6 4H9M15 4h3.4A1.6 1.6 0 0 1 20 5.6V9M20 15v3.4a1.6 1.6 0 0 1-1.6 1.6H15M9 20H5.6A1.6 1.6 0 0 1 4 18.4V15"/>
        </svg>
        <svg class="icono-contraer" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 4v3.4A1.6 1.6 0 0 1 7.4 9H4M20 9h-3.4A1.6 1.6 0 0 1 15 7.4V4M15 20v-3.4a1.6 1.6 0 0 1 1.6-1.6H20M4 15h3.4A1.6 1.6 0 0 1 9 16.6V20"/>
        </svg>
      </button>

      <!-- Capa que se genera automáticamente con MODO_CALIBRACION = true -->
      <div class="capa-calibracion" id="capaCalibracion" hidden aria-hidden="true"></div>
    </main>
  </div>

  <!-- ============================================================
       VISTA B · LIGHTBOX DE HISTORIA (modal a pantalla completa)
       ============================================================ -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true"
       aria-labelledby="tituloHistoria" aria-describedby="textoCapitulo"
       aria-hidden="true" inert>

    <div class="lightbox-fondo" aria-hidden="true">
      <div class="lightbox-destellos" id="destellos"></div>
    </div>
    <div class="lightbox-velo" aria-hidden="true"></div>

    <header class="lightbox-cabecera">
      <button class="btn-cerrar" id="btnCerrar" type="button" aria-label="Volver al árbol">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 12H4M11 5l-7 7 7 7" stroke-linejoin="round"/>
        </svg>
        <span>Volver al Árbol</span>
      </button>
      <p class="lightbox-contador" id="contadorHistoria">Historia 1 de 5</p>
    </header>

    <div class="lightbox-contenido" id="lightboxContenido">

      <!-- Columna izquierda: narración y capítulos (55 %) -->
      <section class="columna-texto" id="columnaTexto">
        <p class="historia-kicker" id="kickerHistoria">Historia 1 · María y José</p>
        <h1 class="historia-titulo" id="tituloHistoria">El Viaje a Belén</h1>

        <div class="separador" aria-hidden="true">
          <span></span>
          <svg viewBox="0 0 24 24"><path d="M12 3l1.9 6.1L20 11l-6.1 1.9L12 19l-1.9-6.1L4 11l6.1-1.9z"/></svg>
          <span></span>
        </div>

        <div class="bloque-capitulo" id="bloqueCapitulo" aria-live="polite">
          <p class="capitulo-etiqueta" id="etiquetaCapitulo">Capítulo 1</p>
          <h2 class="capitulo-titulo" id="tituloCapitulo">El camino largo</h2>
          <p class="capitulo-texto" id="textoCapitulo"></p>
        </div>

        <nav class="navegacion" aria-label="Navegación de capítulos">
          <button class="btn-capitulo" id="btnAnteriorCap" type="button" aria-label="Capítulo anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.8 5.2L8 12l6.8 6.8"/></svg>
          </button>

          <div class="progreso">
            <div class="puntos" id="puntosCapitulos" role="group" aria-label="Ir a un capítulo"></div>
            <span class="indicador-capitulo" id="indicadorCapitulo">1 / 3</span>
          </div>

          <button class="btn-capitulo" id="btnSiguienteCap" type="button" aria-label="Capítulo siguiente">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9.2 5.2L16 12l-6.8 6.8"/></svg>
          </button>
        </nav>
      </section>

      <!-- Columna derecha: bambalina gigante con el video dentro (45 %) -->
      <section class="columna-bambalina" aria-label="Esfera de cristal con el video de la historia">
        <div class="bambalina-escena" id="bambalinaEscena">
          <div class="bambalina-halo" aria-hidden="true"></div>

          <div class="bambalina-marco-video">
            <video id="videoHistoria" autoplay muted loop playsinline preload="metadata"
                   aria-hidden="true" tabindex="-1"></video>
            <span class="bambalina-brillo" aria-hidden="true"></span>
          </div>

          <img class="bambalina-cristal" src="recursos/bambalina.webp"
               alt="" draggable="false">
        </div>

        <p class="nota-video" id="notaVideo" hidden></p>
        <p class="pista-lectura">Una esfera, un cuento · <span id="contadorCapitulosBambalina">3 capítulos</span></p>
      </section>
    </div>
  </div>

  <!-- Avisos breves (volumen, errores, etc.) -->
  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <noscript>
    <p class="sin-js">Esta experiencia necesita JavaScript activado para funcionar.</p>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
