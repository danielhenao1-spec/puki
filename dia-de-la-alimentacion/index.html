<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#160e09">
  <meta name="description" content="Pantalla del Día de la Alimentación: cocina ilustrada con videos en el pendón central.">
  <title>Día de la Alimentación · Puki</title>

  <link rel="preload" as="image" href="fuentes/Dia%20de%20la%20Alimentacion.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="stage" aria-label="Día de la Alimentación">
    <!-- Relleno ambiental para pantallas que no son 16:9 -->
    <div class="backdrop" aria-hidden="true"></div>

    <section class="scene" aria-label="Escena de cocina con pendón">
      <!-- Capa trasera (z-index 1): videos verticales visibles por el recorte alfa -->
      <div class="video-slot" aria-hidden="true">
        <video id="video-a" class="layer-video" muted playsinline preload="auto"
               disablepictureinpicture disableremoteplayback tabindex="-1"></video>
        <video id="video-b" class="layer-video" muted playsinline preload="auto"
               disablepictureinpicture disableremoteplayback tabindex="-1"></video>
      </div>

      <!-- Capa frontal (z-index 2): PNG con el hueco transparente del pendón -->
      <img class="banner"
           src="fuentes/Dia%20de%20la%20Alimentacion.png"
           alt="Ilustración de una cocina cálida con un pendón central que dice Día de la Alimentación"
           draggable="false">
    </section>

    <div class="vignette" aria-hidden="true"></div>

    <!-- Cortina de carga; también sirve de aviso si el autoplay está bloqueado -->
    <div class="curtain" id="curtain" aria-hidden="true">
      <div class="curtain__inner">
        <div class="loader" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p class="curtain__hint" id="hint">Preparando la cocina…</p>
      </div>
    </div>

    <p class="sr-only" id="status" role="status" aria-live="polite"></p>
  </main>

  <script src="player.js"></script>
</body>
</html>
